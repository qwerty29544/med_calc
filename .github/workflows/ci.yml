name: Проверка калькулятора
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: npm install -g pnpm@12.8.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm content:compile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Браузерные проверки
        run: |
          pnpm dev > /tmp/medcalc-dev.log 2>&1 &
          for i in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3000/login >/dev/null && curl --silent --fail http://127.0.0.1:3001/api/v1/health >/dev/null; then break; fi
            sleep 2
          done
          pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results
